<div class="backdrop contact-backdrop is-hidden" id="contact-modal">
  <div class="modal contact-modal">
    <button type="button" aria-label="Close" class="modal-close">
      <svg class="modal-close-icon" width="24" height="24" aria-hidden="true">
        <use href="./images/icons.svg#x"></use>
      </svg>
    </button>
    <h2 class="contact-modal-title">Register</h2>
    <p class="contact-modal-event">Cozy Book Club — “The Midnight Library”</p>
    <form class="contact-form" novalidate>
      <label class="contact-form-field">
        <span class="contact-form-label">Name*</span>
        <input
          class="contact-form-input"
          type="text"
          name="name"
          placeholder="Ann"
          required
        />
        <span class="contact-form-error">Please enter your name</span>
      </label>
      <label class="contact-form-field">
        <span class="contact-form-label">Email*</span>
        <input
          class="contact-form-input"
          type="email"
          name="email"
          placeholder="hello@booksy.com"
          required
        />
        <span class="contact-form-error">Please enter a valid email</span>
      </label>
      <label class="contact-form-field">
        <span class="contact-form-label">Message</span>
        <textarea
          class="contact-form-input contact-form-textarea"
          name="message"
          placeholder="Type your message..."
        ></textarea>
      </label>
      <button class="contact-form-btn" type="submit">Register</button>
    </form>
  </div>
</div>
