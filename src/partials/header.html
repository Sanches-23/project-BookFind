<header class="header">
  <div class="container header-container">
    <nav class="header-nav">
      <a
        class="header-logo"
        href="./index.html"
        aria-label="Booksy — go to homepage"
      >
        <svg
          class="header-logo-icon"
          width="84"
          height="36"
          role="img"
          aria-hidden="true"
        >
          <use href="../svg/logo.svg"></use>
        </svg>
      </a>

      <ul class="header-nav-list">
        <li class="header-nav-item">
          <a class="header-nav-link" href="#home">Home</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#books">Books</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#feedbacks">Feedbacks</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#events">Events</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#location">Location</a>
        </li>
      </ul>
    </nav>

    <button
      class="burger-btn"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      data-menu-open
    >
      <svg class="burger-icon" width="24" height="24" aria-hidden="true">
        <use href="../svg/icons.svg#icon-menu"></use>
      </svg>
    </button>
  </div>

  <div class="mobile-menu" id="mobile-menu" data-menu aria-hidden="true">
    <div class="container mobile-menu-container">
      <div class="mobile-menu-header">
        <a
          class="mobile-menu-logo"
          href="./index.html"
          aria-label="Booksy — go to homepage"
        >
          <svg
            class="mobile-menu-logo-icon"
            width="84"
            height="36"
            aria-hidden="true"
          >
            <use href="../svg/logo.svg"></use>
          </svg>
        </a>
        <button
          type="button"
          class="mobile-menu-close-btn"
          aria-label="Close menu"
          data-menu-close
        >
          <svg
            class="mobile-menu-close-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="../svg/icons.svg#icon-x"></use>
          </svg>
        </button>
      </div>

      <nav class="mobile-menu-nav">
        <ul class="mobile-menu-list">
          <li class="mobile-menu-item">
            <a class="mobile-menu-link" href="#home">Home</a>
          </li>

          <li class="mobile-menu-item">
            <a class="mobile-menu-link" href="#books">Books</a>
          </li>
          </li>

          <li class="mobile-menu-item">
            <a class="mobile-menu-link" href="#feedbacks">Feedbacks</a>
          </li>
          <li class="mobile-menu-item">
            <a class="mobile-menu-link" href="#events">Events</a>
          </li>
          <li class="mobile-menu-item">
            <a class="mobile-menu-link" href="#location">Location</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <script type="module" src="./js/menu.js"></script>
</header>
